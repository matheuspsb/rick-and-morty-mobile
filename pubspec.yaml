name: rick_morty_mobile
description: "Mobile port of the Rick & Morty Field Archive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  go_router: ^18.0.0

  dio: ^5.11.0

  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: any

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.3.0

  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.14.1

  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
