name: rick_morty_mobile
description: "Mobile port of the Rick & Morty Field Archive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  go_router: ^18.0.0

  dio: ^5.11.0

  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: any

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.3.0

  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.14.1

  mocktail: ^1.0.5

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F4F1EA"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
  windows:
    generate: true
